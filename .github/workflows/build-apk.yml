name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Web Directory & Capacitor
        run: |
          mkdir -p dist
          cp -r index.html manifest.json sw.js icon* dist/ 2>/dev/null || cp -r * dist/ 2>/dev/null || true
          npm init -y
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0
          npx cap init "CONSTRUYE.PRO" "com.construyepro.app" --web-dir dist
          npx cap add android

          # Resolver conflicto de clases duplicadas de Kotlin
          echo "android.enableDuplicateClassesCheck=false" >> android/gradle.properties
          
          # Forzar sincronización
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CONSTRUYE-PRO-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
